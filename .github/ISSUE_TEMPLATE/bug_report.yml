name: Bug report
description: Something in Sitecatch doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Never paste your Notion token**, AMO keys, or private page content here.
        Security issues: please report them privately instead (see [SECURITY.md](https://github.com/3333444n/sitecatch/blob/main/SECURITY.md)).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Include the exact error message if one was shown.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the popup on https://example.com
        2. Pick the "Resources" preset
        3. Click Save
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sitecatch version
      description: From `about:addons` (Firefox) or `chrome://extensions`, or the commit if built from source.
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Firefox (desktop)
        - Firefox for Android
        - Chrome
        - Other Chromium browser
    validations:
      required: true
  - type: input
    id: browser-version
    attributes:
      label: Browser and OS version
      placeholder: Firefox 145, macOS 15
  - type: dropdown
    id: token-kind
    attributes:
      label: How is Notion connected?
      options:
        - Personal access token
        - Internal connection
        - Not set up yet
  - type: textarea
    id: preset
    attributes:
      label: Preset / property types involved (optional)
      description: Which property types are mapped and how (extract / ask / fixed). An exported preset JSON is fine; it never contains your token.
  - type: textarea
    id: logs
    attributes:
      label: Console output (optional)
      description: From the extension's background console (`about:debugging` → Sitecatch → Inspect). Check it doesn't contain private data.
      render: text
