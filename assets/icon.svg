<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Sitecatch</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F26B3A"/>
      <stop offset="1" stop-color="#D9482B"/>
    </linearGradient>
    <!-- Cuts a gap into the page where the hook passes in front of it. -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#FFFFFF"/>
      <path d="M24 64a40 40 0 0 0 80 0" fill="none" stroke="#000000" stroke-width="26" stroke-linecap="round"/>
    </mask>
  </defs>
  <!-- Rounded square: a solid fill reads on both light and dark toolbars. -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <!-- The page being caught, tilted as if dropping in. -->
  <g mask="url(#gap)">
  <g transform="rotate(-14 64 50)">
    <path d="M44 18h28l14 14v40a6 6 0 0 1-6 6H44a6 6 0 0 1-6-6V24a6 6 0 0 1 6-6z" fill="#FFFFFF"/>
    <path d="M72 18v10a4 4 0 0 0 4 4h10z" fill="#F5C6B5"/>
    <path d="M48 46h26M48 56h20" stroke="#E2603A" stroke-width="5" stroke-linecap="round"/>
  </g>
  </g>
  <!-- The catch: a cupped hook in front of the page. -->
  <path d="M24 64a40 40 0 0 0 80 0" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round"/>
</svg>
